<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrace Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="text-gray-800">

    <div id="auth-page" class="page-section active h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-200">
            <div class="text-center mb-6">
                <i class="fa-solid fa-leaf text-green-600 text-4xl mb-2"></i>
                <h1 class="text-2xl font-bold text-gray-900">EcoTrace</h1>
                <p class="text-gray-500 text-sm">Compliance & Sustainability Ledger</p>
            </div>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email Address" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                
                <div class="flex gap-4">
                    <select id="role-select" class="w-1/2 p-3 border rounded-lg bg-gray-50">
                        <option value="institution">Institution</option>
                        <option value="handler">Waste Handler</option>
                    </select>
                    <input type="text" id="org-name" placeholder="Org Name" class="w-1/2 p-3 border rounded-lg">
                </div>

                <button onclick="handleLogin()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 transition">Sign In / Sign Up</button>
                <p id="auth-msg" class="text-center text-sm text-red-500 mt-2"></p>
            </div>
        </div>
    </div>

    <div id="main-app" class="page-section hidden min-h-screen">
        <nav class="bg-white shadow-sm border-b fixed w-full top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-leaf text-green-600 text-xl"></i>
                    <span class="font-bold text-lg">EcoTrace</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-display" class="text-sm font-medium text-gray-600">User</span>
                    <button onclick="doLogout()" class="text-red-500 hover:text-red-700 text-sm">Logout</button>
                </div>
            </div>
        </nav>

        <div class="flex pt-16 h-screen">
            <aside class="w-64 bg-white border-r hidden md:block fixed h-full">
                <div class="p-6 space-y-2">
                    <div onclick="showPage('dashboard')" class="nav-link active flex items-center gap-3">
                        <i class="fa-solid fa-grid-2"></i> Dashboard
                    </div>
                    <div onclick="showPage('activities')" class="nav-link flex items-center gap-3">
                        <i class="fa-solid fa-list-check"></i> Activities
                    </div>
                    <div onclick="showPage('waste')" class="nav-link flex items-center gap-3">
                        <i class="fa-solid fa-recycle"></i> Waste Pickup
                    </div>
                    <div onclick="showPage('reports')" class="nav-link flex items-center gap-3">
                        <i class="fa-solid fa-chart-pie"></i> Reports
                    </div>
                </div>
            </aside>

            <main class="flex-1 ml-0 md:ml-64 p-8 overflow-y-auto">
                
                <div id="view-dashboard" class="page-section active">
                    <h2 class="text-2xl font-bold mb-6">Overview</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-green-100">
                            <p class="text-gray-500 text-sm">Total Credits</p>
                            <h3 class="text-3xl font-bold text-green-700">1,250</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-blue-100">
                            <p class="text-gray-500 text-sm">Activities Logged</p>
                            <h3 class="text-3xl font-bold text-gray-800" id="stat-count">0</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-yellow-100">
                            <p class="text-gray-500 text-sm">Pending Verification</p>
                            <h3 class="text-3xl font-bold text-yellow-600" id="stat-pending">0</h3>
                        </div>
                    </div>
                </div>

                <div id="view-activities" class="page-section hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Activity Log</h2>
                        <button onclick="openModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">+ New Activity</button>
                    </div>
                    <div id="activity-list" class="space-y-4">
                        </div>
                </div>

                <div id="view-waste" class="page-section hidden">
                    <h2 class="text-2xl font-bold mb-4">Waste Management</h2>
                    <p class="text-gray-500 mb-6">Request pickup for recyclable materials.</p>
                    <div class="bg-white p-6 rounded-xl shadow-sm border">
                        <h3 class="font-bold mb-4">Request Pickup</h3>
                        <div class="flex gap-4">
                            <select id="waste-type" class="border p-2 rounded w-1/3">
                                <option>Plastic</option>
                                <option>E-Waste</option>
                                <option>Paper</option>
                            </select>
                            <input type="number" id="waste-qty" placeholder="Est. Kg" class="border p-2 rounded w-1/3">
                            <button onclick="requestPickup()" class="bg-blue-600 text-white px-4 py-2 rounded w-1/3">Request Handler</button>
                        </div>
                    </div>
                    <div id="waste-list" class="mt-8 space-y-4">
                        </div>
                </div>

            </main>
        </div>
    </div>

    <div id="activity-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg">
            <h3 class="text-xl font-bold mb-4">Log New Activity</h3>
            <input type="text" id="act-desc" placeholder="Description (e.g., Tree Plantation)" class="w-full border p-3 rounded mb-3">
            <select id="act-status" class="w-full border p-3 rounded mb-3">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <input type="date" id="act-date" class="w-full border p-3 rounded mb-4">
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="text-gray-500">Cancel</button>
                <button onclick="submitActivity()" class="bg-green-600 text-white px-6 py-2 rounded">Save</button>
            </div>
        </div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
